<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="assets/CSS/contribute.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanprastha Foundation</title>
</head>
<body>

        <section class="contribution">
           
            <p>Thank you for contributing to us. Your donations shall aid us to fulfill our mission and promise.</p>
            </section>
          <section class="contribute">
        
        <form action="#" method="POST">
    
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" placeholder="Name" required>

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" placeholder="abc@gmail.com" required>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" placeholder="999999999" required>


    <div id="donationAmountField"">
      <label for="amount">Donation Amount (INR):</label>
      <input type="number" id="amount" name="amount" min="0">
    </div>

    <label for="message">Message (Optional):</label>
    <textarea id="message" name="message" rows="4" placeholder="Anything you'd like to share..."></textarea>

    <button type="submit">Submit</button>
  </form>
</section>
    
</body>
